<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 570" role="img"><style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#363432;font-size:20px}.title{font-size:27px;font-weight:600}.small{font-size:16px}.box{fill:#f6f2ed;stroke:#c9bfc5;stroke-width:2}.wire{fill:none;stroke-width:4;stroke-linejoin:round}</style><rect width="1000" height="570" fill="#fcfbf8"/><title>Tobi USB 接线：ESP32-C3、SSD1306 与 TTP223</title><text class="title" x="35" y="46">Tobi 课程接线 · USB 供电</text><rect class="box" x="45" y="105" width="245" height="390" rx="8"/><text x="65" y="145">ESP32-C3 SuperMini</text><rect class="box" x="665" y="100" width="295" height="220" rx="8"/><text x="685" y="140">SSD1306 · I2C 128×64</text><rect class="box" x="665" y="370" width="295" height="155" rx="8"/><text x="685" y="405">TTP223 · 非锁存 / 高有效</text><text x="160" y="187">3V3</text><path class="wire" stroke="#bd4e4e" d="M290 195 H345 V180 H665"/><text x="680" y="186">VCC</text><text x="160" y="247">GND</text><path class="wire" stroke="#545459" d="M290 255 H400 V220 H665"/><text x="680" y="226">GND</text><text x="160" y="307">20 / RX</text><path class="wire" stroke="#32845c" d="M290 315 H455 V260 H665"/><text x="680" y="266">SDA</text><text x="160" y="367">21 / TX</text><path class="wire" stroke="#3978b4" d="M290 375 H510 V295 H665"/><text x="680" y="301">SCL</text><text x="160" y="427">10</text><path class="wire" stroke="#bd832b" d="M290 435 H565 V495 H665"/><text x="680" y="501">OUT</text><path class="wire" stroke="#bd4e4e" d="M345 195 V440 H665"/><circle cx="345" cy="195" r="5" fill="#bd4e4e"/><text class="small" x="680" y="446">VCC</text><path class="wire" stroke="#545459" d="M400 255 V468 H665"/><circle cx="400" cy="255" r="5" fill="#545459"/><text class="small" x="680" y="474">GND</text><text class="small" x="45" y="540">先断电接线。按名称找引脚；仿真按钮连接 GPIO10 与 3V3，替代 TTP223 输出。</text></svg>
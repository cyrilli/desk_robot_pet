  <text class="label" x="296" y="33">TTP223 触摸模块</text>
  <text class="note" x="296" y="55">电极朝向头顶内壁</text>
  <text class="label" x="17" y="207">OLED 屏幕</text>
  <text class="note" x="17" y="230">显示面朝前窗</text>
  <text class="label" x="374" y="200">USB 插线方向</text>
  <text class="note" x="374" y="222">后侧缺口需试插</text>
  <text class="label" x="307" y="311">ESP32-C3 开发板</text>
  <text class="note" x="307" y="333">放在底板上方</text>
  <text class="note" x="17" y="311">头盔与底板的中央剖面</text>
  <text class="note" x="17" y="333">器件为拟议位置，待试装</text>
</g>
</svg>
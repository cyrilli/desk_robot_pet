<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 356" role="img" aria-labelledby="title desc">
<title id="title">Tobi 头盔侧剖与器件布置设想</title>
<desc id="desc">从侧面剖开原头盔，面窗在左，底板在下。OLED 竖在面窗后，感应电极朝向头顶部内侧，主控在底部，USB 插口朝后侧缺口。壳壁与底板取自原模型中心剖面，器件位置和插头空间待试装。</desc>
